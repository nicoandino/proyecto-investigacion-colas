[server]
headless = true
port = 8501
# El watcher por eventos no detecta los cambios en los módulos de sim/ y ui/ en esta
# carpeta (ruta con espacios y acentos), así que se usa sondeo: con "poll" Streamlit
# recarga la app al guardar cualquier archivo del proyecto.
fileWatcherType = "poll"

[theme]
# Paleta Shell (ORQUESTADOR §8.1): amarillo #FBCE07 y rojo #DD1D21.
base = "light"
primaryColor = "#DD1D21"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF6C2"
textColor = "#1A1A1A"
font = "sans serif"

[browser]
gatherUsageStats = false
